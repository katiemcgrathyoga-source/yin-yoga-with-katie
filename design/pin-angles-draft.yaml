# Pin angles — first draft, for Katie to edit
# ============================================
# Two per pose, 42 poses, 84 angles. Each block drops straight into that pose's
# frontmatter in src/content/poses/<slug>.md.
#
# LIMITS (enforced by the build guard, see design/pin-system.html)
#   audience  ≤ 22 characters
#   headline  ≤ 40 characters   ← capped at 40, not 46, so one angle works in
#                                 every template including List and Split
#   proof     ≤ 54 characters
#
# THE FIVE FORMULAS these were written against
#   1  the exact moment      "The hip you notice at mile four"
#   2  the time contrast     "Two minutes to undo eight hours"
#   3  the one-thing promise "One leg long, three minutes"
#   4  the unexpected cause  "The glute that sitting switches off"
#   5  the objection killer  "A hamstring stretch you can't fail"
#
# THE RULES
#   A number wherever one is true. Second person. Moments, not anatomy.
#   Never a health claim. No unlock / transform / secret / ultimate.
#
# THE AUDIENCE TAG IS THE BOARD — that is what makes the calendar automatic:
#   for runners          → Yoga for Runners
#   for tired legs       → Yoga for Runners
#   if you sit all day   → Yoga for Desk Workers
#   for stiff shoulders  → Yoga for Desk Workers
#   for restless nights  → Yin Yoga for Sleep & Relaxation
#   when you're wound up → Yin Yoga for Stress & Calm
#   for beginners        → Yin Yoga for Beginners
#   for tight hips       → Yoga for Flexibility & Mobility
#   for a stiff back     → Yoga for Flexibility & Mobility
#
# Every pose gets two different boards, so the calendar can always spread a day's
# two pins across two boards without repeating itself.
#
# WHERE THESE CAME FROM
# Each one is derived from that pose's own `benefits` and `target_areas`, then
# rewritten from the reader's side. The anatomy did not go anywhere — it moved
# into the proof line, or onto the page the pin lands on.
#
# WHAT TO CHANGE
# The headline is the part that matters and the part most likely to sound like
# me rather than you. Read each one out loud; if you would not say it to someone
# after class, rewrite it. The proof lines are mostly your own cueing already.

