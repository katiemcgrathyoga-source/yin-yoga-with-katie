# Pin angles — the journal, first draft
# =====================================
# Nine posts, two angles each on two different boards, plus a `pin_quote` for
# every one. Each block drops into that post's frontmatter in src/content/blog/.
#
# WHY THE QUOTES MATTER HERE
# The four Journal Pin templates already exist and work (netlify/functions/lib/
# journalpin.mjs), and there is a blush/sage Quote pin waiting on `pin_quote` —
# but no post has ever had one, so that variant has never rendered. Adding these
# nine unlocks eighteen pins (light and dark) that cost nothing new to build.
#
# Journal posts are the highest-intent pins in the system: they land on a page
# with a signup on it, not just a pose. Worth pinning more often than the ratio
# would suggest.
#
# Limits are the same as everywhere: audience ≤22, headline ≤40, proof ≤54.
# `pin_quote` has no limit — it sets at 84px on the Quote pin, so keep it under
# about ninety characters or it wraps past four lines.

a-new-home-for-yin:
  pin_quote: "One calm place to find the practice you need."
  pin_angles:
    - audience: "for beginners"
      headline: "Every class, finally in one place"
      proof: "Free, and sorted by what you actually need."
    - audience: "for a full-body reset"
      headline: "No more scrolling for a class"
      proof: "The whole library, sorted. Nothing to pay."

