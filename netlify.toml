# Netlify build configuration for the Astro static site.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Serverless OG-image function (satori + resvg). Fonts are embedded in the code
# (netlify/functions/lib/fonts.mjs), so nothing extra needs shipping.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Every collection page builds to `.../<slug>/index.html`, but Netlify's static
# server happily answers the no-slash form too, so both were live as separate
# 200s — Search Console had them indexed as two URLs splitting one page's
# signal (seen on /poses/seated-twist). Force the slash form; not `force =
# true`, so a real static file always wins first — poses/<slug>.jpg lives at
# that same path shape and must never be redirected.
[[redirects]]
  from = "/poses/:slug"
  to = "/poses/:slug/"
  status = 301

[[redirects]]
  from = "/routines/:slug"
  to = "/routines/:slug/"
  status = 301

[[redirects]]
  from = "/videos/:slug"
  to = "/videos/:slug/"
  status = 301

[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug/"
  status = 301

# Short links for the Strava posts: yinyogawithkatie.com/r/<alias>. Ours rather
# than a bit.ly, so the link plainly reads as Katie's and Cloudflare still sees
# strava.com as the referrer. The aliases are mirrored in
# netlify/functions/lib/strava-routine.mjs (SHORT), and its test fails if the
# two lists drift. 301 so the routine page keeps the search signal.
#
# `?for=runners` switches the page's email offer to the Post-Run Reset: everyone
# arriving this way came from a run, even on a routine that isn't runner-tagged.
# See the client script in src/components/Cta.astro.
[[redirects]]
  from = "/r/day-after"
  to = "/routines/the-day-after/?for=runners"
  status = 301

[[redirects]]
  from = "/r/outside"
  to = "/routines/the-outside-line/?for=runners"
  status = 301

[[redirects]]
  from = "/r/hips"
  to = "/routines/deep-hips-lower-body/?for=runners"
  status = 301

[[redirects]]
  from = "/r/legs"
  to = "/routines/deep-legs-hamstrings/?for=runners"
  status = 301

[[redirects]]
  from = "/r/back"
  to = "/routines/lower-back-release/?for=runners"
  status = 301

[[redirects]]
  from = "/r/full"
  to = "/routines/full-body-reset/?for=runners"
  status = 301

[[redirects]]
  from = "/r/tight-hips"
  to = "/routines/tight-hips-after-running/?for=runners"
  status = 301

[[redirects]]
  from = "/r/rest-day"
  to = "/routines/rest-day-recovery/?for=runners"
  status = 301

[[redirects]]
  from = "/r/after-run"
  to = "/routines/after-the-run/?for=runners"
  status = 301
